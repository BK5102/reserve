# Synthetic end-to-end check (methodology M17, M30). NOT real data and never a result.
# Runs prepare + run in well under a minute on a laptop CPU.
name: synthetic_small
seed: 0
data:
  source: synthetic
  raw_dir: data/synthetic/synthetic_small
  interim_dir: data/interim/synthetic_small
  synthetic:
    first_vintage: "2003Q1"
    n_vintages: 36
    loans_per_vintage: 400
    data_end: "2012-12"
    seed: 4
macro:
  mode: asof            # asof (ALFRED vintages) | latest (revisions ignored, flagged) | none
evaluation:
  period: dev           # synthetic data is only ever scored as dev
  origins:
    dev: {first: "2007-03", last: "2010-12"}
  step_months: 3
  horizon: 12
  min_history: 6
  quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]
  exclude_target_windows: []
contestants:
  A_last_increment: {window: 3}
  B_age_curve: {donors: 8}
  C_hazard_macro: {draws: 200, exit_window: 24}
  tsfm: [fake]
lock_dir: locks
artifacts_dir: artifacts/runs
