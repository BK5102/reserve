name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version instead of cancelling the rest on one failure.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
          python-version: ${{ matrix.python-version }}
      - name: Install (no TSFM extra, so no model weights or PyTorch)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Synthetic end-to-end run (pipeline check, not a result)
        run: uv run reserve prepare synthetic --config configs/synthetic_small.yaml && uv run reserve run configs/synthetic_small.yaml
      - name: Rehearse the real-data commands on SYNTHETIC files (docs/runbook.md, methodology M41)
        run: uv run python scripts/rehearse_real_path.py
